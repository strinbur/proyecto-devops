name: CI/CD Docker Build & Deploy

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # ================= BUILD + PUSH =================

      - name: Build ventas
        run: docker build -t strinbur/ventas-api:latest ./back-Ventas_SpringBoot/Springboot-API-REST

      - name: Push ventas
        run: docker push strinbur/ventas-api:latest

      - name: Build despachos
        run: docker build -t strinbur/despachos-api:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

      - name: Push despachos
        run: docker push strinbur/despachos-api:latest

      - name: Build frontend
        run: docker build -t strinbur/frontend-app:latest ./front_despacho

      - name: Push frontend
        run: docker push strinbur/frontend-app:latest

      # ================= DEPLOY (BACKEND EC2) =================

      - name: Deploy backend EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            docker pull strinbur/ventas-api:latest
            docker pull strinbur/despachos-api:latest

            docker stop ventas || true
            docker rm ventas || true

            docker stop despachos || true
            docker rm despachos || true

            docker run -d --name ventas -p 8080:8080 \
              -e DB_ENDPOINT=10.0.150.64 \
              -e DB_PORT=3306 \
              -e DB_NAME=devopsdb \
              -e DB_USERNAME=root \
              -e DB_PASSWORD=root \
              strinbur/ventas-api:latest

            docker run -d --name despachos -p 8081:8081 \
              -e DB_ENDPOINT=10.0.150.64 \
              -e DB_PORT=3306 \
              -e DB_NAME=devopsdb \
              -e DB_USERNAME=root \
              -e DB_PASSWORD=root \
              strinbur/despachos-api:latest

      # ================= DEPLOY FRONTEND EC2 =================

      - name: Deploy frontend EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONT_HOST }}
          username: ${{ secrets.EC2_FRONT_USER }}
          key: ${{ secrets.EC2_FRONT_KEY }}
          script: |

            docker pull strinbur/frontend-app:latest

            docker stop frontend || true
            docker rm frontend || true

            docker run -d --name frontend \
              -p 5173:5173 \
              strinbur/frontend-app:latest