name: CI/CD Docker Build & Push

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # =========================
      # VENTAS
      # =========================
      - name: Build ventas
        run: docker build -t stirnbur/ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST

      - name: Push ventas
        run: docker push stirnbur/ventas:latest

      # =========================
      # DESPACHOS
      # =========================
      - name: Build despachos
        run: docker build -t stirnbur/despachos:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

      - name: Push despachos
        run: docker push stirnbur/despachos:latest

      # =========================
      # FRONTEND
      # =========================
      - name: Build frontend
        run: docker build -t stirnbur/frontend:latest ./front_despacho

      - name: Push frontend
        run: docker push stirnbur/frontend:latest